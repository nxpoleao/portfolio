<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480" role="img" aria-labelledby="atlasTitle">
  <title id="atlasTitle">Mockup placeholder da interface do projeto ATLAS — a ser editado</title>
  <defs>
    <linearGradient id="atlasBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#151517"/>
      <stop offset="1" stop-color="#0d0d0f"/>
    </linearGradient>
    <pattern id="atlasGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#1f1f22" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="640" height="480" fill="url(#atlasBg)"/>
  <rect width="640" height="480" fill="url(#atlasGrid)"/>

  <!-- browser chrome -->
  <rect x="0" y="0" width="640" height="36" fill="#1a1a1d"/>
  <circle cx="20" cy="18" r="5" fill="#3a3a3e"/>
  <circle cx="38" cy="18" r="5" fill="#3a3a3e"/>
  <circle cx="56" cy="18" r="5" fill="#3a3a3e"/>
  <rect x="90" y="10" width="220" height="16" rx="4" fill="#232327"/>

  <!-- centered placeholder mark -->
  <g transform="translate(320,258)" text-anchor="middle">
    <rect x="-120" y="-90" width="240" height="150" rx="6" fill="none" stroke="#313136" stroke-width="1.5" stroke-dasharray="6 6"/>
    <text y="-30" font-family="JetBrains Mono, monospace" font-size="15" fill="#626268">[ mockup do ATLAS ]</text>
    <text y="-4" font-family="JetBrains Mono, monospace" font-size="12" fill="#4a4a4f">substitua por um print</text>
    <text y="16" font-family="JetBrains Mono, monospace" font-size="12" fill="#4a4a4f">ou mockup real do projeto</text>
  </g>
</svg>
