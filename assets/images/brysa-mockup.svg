<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480" role="img" aria-labelledby="brysaTitle">
  <title id="brysaTitle">Mockup abstrato da interface do e-commerce BRYSA</title>
  <defs>
    <linearGradient id="brysaBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#151517"/>
      <stop offset="1" stop-color="#0d0d0f"/>
    </linearGradient>
  </defs>
  <rect width="640" height="480" fill="url(#brysaBg)"/>

  <!-- browser chrome -->
  <rect x="0" y="0" width="640" height="36" fill="#1a1a1d"/>
  <circle cx="20" cy="18" r="5" fill="#3a3a3e"/>
  <circle cx="38" cy="18" r="5" fill="#3a3a3e"/>
  <circle cx="56" cy="18" r="5" fill="#3a3a3e"/>
  <rect x="90" y="10" width="300" height="16" rx="4" fill="#232327"/>

  <!-- nav -->
  <rect x="0" y="36" width="640" height="52" fill="#111113"/>
  <text x="32" y="68" font-family="Space Grotesk, sans-serif" font-size="18" fill="#f2f2f0" font-weight="600">BRYSA</text>
  <rect x="420" y="54" width="46" height="10" rx="2" fill="#3a3a3e"/>
  <rect x="480" y="54" width="46" height="10" rx="2" fill="#3a3a3e"/>
  <rect x="540" y="54" width="60" height="20" rx="10" fill="#f5a623"/>

  <!-- hero -->
  <rect x="32" y="112" width="576" height="140" rx="6" fill="#1a1a1d" stroke="#232327"/>
  <rect x="56" y="140" width="220" height="18" rx="3" fill="#e8e8e6"/>
  <rect x="56" y="168" width="160" height="12" rx="3" fill="#5a5a5f"/>
  <rect x="56" y="200" width="120" height="30" rx="15" fill="#f5a623"/>
  <rect x="360" y="132" width="216" height="96" rx="4" fill="#232327"/>

  <!-- product grid -->
  <g>
    <rect x="32" y="276" width="130" height="150" rx="4" fill="#1a1a1d" stroke="#232327"/>
    <rect x="32" y="276" width="130" height="100" rx="4" fill="#28282c"/>
    <rect x="40" y="386" width="90" height="10" rx="2" fill="#8a8a8f"/>
    <rect x="40" y="402" width="50" height="10" rx="2" fill="#f5a623"/>
  </g>
  <g>
    <rect x="176" y="276" width="130" height="150" rx="4" fill="#1a1a1d" stroke="#232327"/>
    <rect x="176" y="276" width="130" height="100" rx="4" fill="#28282c"/>
    <rect x="184" y="386" width="90" height="10" rx="2" fill="#8a8a8f"/>
    <rect x="184" y="402" width="50" height="10" rx="2" fill="#f5a623"/>
  </g>
  <g>
    <rect x="320" y="276" width="130" height="150" rx="4" fill="#1a1a1d" stroke="#232327"/>
    <rect x="320" y="276" width="130" height="100" rx="4" fill="#28282c"/>
    <rect x="328" y="386" width="90" height="10" rx="2" fill="#8a8a8f"/>
    <rect x="328" y="402" width="50" height="10" rx="2" fill="#f5a623"/>
  </g>
  <g>
    <rect x="464" y="276" width="144" height="150" rx="4" fill="#1a1a1d" stroke="#232327"/>
    <rect x="464" y="276" width="144" height="100" rx="4" fill="#28282c"/>
    <rect x="472" y="386" width="100" height="10" rx="2" fill="#8a8a8f"/>
    <rect x="472" y="402" width="50" height="10" rx="2" fill="#f5a623"/>
